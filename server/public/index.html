<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" crossorigin href="/assets/index-FCqFLRf1.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Реєстрація Service Worker для PWA підтримки з авто-оновленням
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            // Перевіряємо наявність оновлення SW щоразу при завантаженні
            reg.update();
          }).catch((err) => console.warn('SW registration failed:', err));

          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
